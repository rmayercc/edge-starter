<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edge Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <!-- The dashboard, laid out for 2560x720: 520 | 720 | 520 | 800.
       Each card is one file in examples/ (and, where it needs the Mac, one
       Rust module in src-tauri/src/examples/). -->
  <main class="dash">
    <div class="col stack">
      <section id="clock"><div class="body"></div></section>
      <section id="weather"><p class="label">Weather</p><div class="body"></div></section>
      <p class="touch-warning" id="touch-status" hidden></p>
    </div>
    <section class="col" id="calendar"><p class="label">Calendar</p><div class="body"></div></section>
    <section class="col" id="todos"><p class="label">To-dos</p><div class="body"></div></section>
    <section class="col" id="launcher"><p class="label">Launcher</p><div class="body"></div></section>
  </main>
  <script src="touch.js"></script>
  <script src="examples/util.js"></script>
  <script src="examples/clock.js"></script>
  <script src="examples/weather.js"></script>
  <script src="examples/launcher.js"></script>
  <script src="examples/todos.js"></script>
  <script src="examples/calendar.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
